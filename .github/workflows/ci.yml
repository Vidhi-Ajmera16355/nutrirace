name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disposable credentials for the throw-away service containers below. Not secrets.
  POSTGRES_USER: nutrirace
  POSTGRES_PASSWORD: ci_only_throwaway
  POSTGRES_DB: nutrirace_ci
  DATABASE_URL: postgresql://nutrirace:ci_only_throwaway@localhost:5432/nutrirace_ci?schema=public
  REDIS_URL: redis://localhost:6379

jobs:
  quality:
    name: Lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prep
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Migrations, API and worker integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nutrirace
          POSTGRES_PASSWORD: ci_only_throwaway
          POSTGRES_DB: nutrirace_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nutrirace -d nutrirace_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prep
      - name: Apply migrations
        run: pnpm --filter @nutrirace/api exec prisma migrate deploy
      - name: Schema drift check (migrations must match schema.prisma)
        run: >-
          pnpm --filter @nutrirace/api exec prisma migrate diff
          --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Seed
        run: pnpm --filter @nutrirace/api exec tsx prisma/seed.ts
      - run: pnpm test:api
      - run: pnpm test:integration

  build:
    name: Production builds and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @nutrirace/web exec playwright install --with-deps chromium
      - run: pnpm --filter @nutrirace/web test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api, worker and web images
        run: |
          docker build -f apps/api/Dockerfile -t nutrirace-api:ci .
          docker build -f apps/worker/Dockerfile -t nutrirace-worker:ci .
          docker build -f apps/web/Dockerfile -t nutrirace-web:ci .

  compose:
    name: Compose infrastructure becomes healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres redis
      - run: docker compose ps
      - if: always()
        run: docker compose down -v
